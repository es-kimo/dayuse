spring:
  profiles:
    default: local
  application:
    name: dayuse-backend

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dayuse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dayuse}
    password: ${DB_PASSWORD:dayuse}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:dayuse-jwt-secret-key-must-be-very-long-and-secure-at-least-256-bits-for-hmac-sha!}
  access-token-expiration-ms: 3600000 # 1 hour
  refresh-token-expiration-ms: 1209600000 # 14 days

kakao:
  client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/callback/kakao}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:dayuse-local-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:dummy-access-key}
    secret-key: ${AWS_SECRET_KEY:dummy-secret-key}
    endpoint: ${AWS_S3_ENDPOINT:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

webpush:
  public-key: ${VAPID_PUBLIC_KEY:BF5PuGK_jwgfQpNNUcTf75z93uuqrwrN1yl4Vkxnhsfi0vWu_dX6vOxFY6DXUyiWVTxqIxz4-Jwz3gGBD-om-EA}
  private-key: ${VAPID_PRIVATE_KEY:NghqENb7xUAkfU6oc9QJJSjNbO1BRPRMOK_rtJqYjNA}
  subject: ${VAPID_SUBJECT:mailto:support@dayuse.kr}

experiment:
  seed:
    # 기동 시 DayuseExperimentDefinitions의 실험 정의를 멱등하게 등록한다(항상 DRAFT로 생성).
    # 이미 존재하는 실험의 상태·rollout은 절대 덮어쓰지 않는다.
    enabled: ${EXPERIMENT_SEED_ENABLED:true}

announcement:
  seed:
    # 로컬 개발 시 기본 데이유 공지들을 자동 시드
    enabled: ${ANNOUNCEMENT_SEED_ENABLED:true}

analytics:
  # 집계·퍼널 조회를 허용할 userId 목록(쉼표 구분). 비워 두면 로그인 사용자 누구나 조회할 수 있다.
  admin-user-ids: ${ANALYTICS_ADMIN_USER_IDS:}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:dayuse-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

jwt:
  secret: dayuse-test-jwt-secret-key-must-be-very-long-and-secure-at-least-256-bits-for-hmac-sha!
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

kakao:
  client-id: test-kakao-client-id
  client-secret: test-kakao-client-secret
  redirect-uri: http://localhost:5173/oauth/callback/kakao

webpush:
  public-key: BF5PuGK_jwgfQpNNUcTf75z93uuqrwrN1yl4Vkxnhsfi0vWu_dX6vOxFY6DXUyiWVTxqIxz4-Jwz3gGBD-om-EA
  private-key: NghqENb7xUAkfU6oc9QJJSjNbO1BRPRMOK_rtJqYjNA
  subject: mailto:test@dayuse.kr

experiment:
  seed:
    # 기동 시 DayuseExperimentDefinitions의 실험 정의를 멱등하게 등록한다(항상 DRAFT로 생성).
    # 이미 존재하는 실험의 상태·rollout은 절대 덮어쓰지 않는다.
    enabled: ${EXPERIMENT_SEED_ENABLED:true}

announcement:
  seed:
    enabled: ${ANNOUNCEMENT_SEED_ENABLED:false}

analytics:
  # 집계·퍼널 조회를 허용할 userId 목록(쉼표 구분). 비워 두면 로그인 사용자 누구나 조회할 수 있다.
  admin-user-ids: ${ANALYTICS_ADMIN_USER_IDS:}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

kakao:
  client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
  client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
  redirect-uri: ${KAKAO_REDIRECT_URI:https://dayuse.kr/oauth/callback/kakao}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:dayuse-prod-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:dummy-access-key}
    secret-key: ${AWS_SECRET_KEY:dummy-secret-key}
    endpoint: ${AWS_S3_ENDPOINT:}

webpush:
  public-key: ${VAPID_PUBLIC_KEY}
  private-key: ${VAPID_PRIVATE_KEY}
  subject: ${VAPID_SUBJECT:mailto:support@dayuse.kr}

experiment:
  seed:
    # 기동 시 DayuseExperimentDefinitions의 실험 정의를 멱등하게 등록한다(항상 DRAFT로 생성).
    # 이미 존재하는 실험의 상태·rollout은 절대 덮어쓰지 않는다.
    enabled: ${EXPERIMENT_SEED_ENABLED:true}

announcement:
  seed:
    # 프로덕션에서는 임의의 테스트 공지가 자동 생성되지 않도록 기본 비활성화
    enabled: ${ANNOUNCEMENT_SEED_ENABLED:false}

analytics:
  # 집계·퍼널 조회 및 실험 관리를 허용할 관리자 userId 목록(쉼표 구분).
  # prod에서는 allow-all-when-empty=false(Fail-Closed)이므로 미지정 시 전원 403으로 차단된다.
  admin-user-ids: ${ANALYTICS_ADMIN_USER_IDS:}
  allow-all-when-empty: ${ANALYTICS_ALLOW_ALL_WHEN_EMPTY:false}
