<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>내 정보</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><div class="t" style="padding-left:4px;font-size:22px">내 정보</div></header>
 <div class="body">
  <div class="center" style="gap:8px;padding:8px 0 4px"><button class="pfp" aria-label="프로필 데이유 색 바꾸기"><i data-dayu="blue" data-face="default" data-size="88px"></i><span class="pen"><i data-icon="palette" class="xs"></i></span></button><div class="t1" style="font-size:18px">류코딩</div><span class="chip" style="background:#FEF9C3;color:#713F12"><i data-icon="kakao" class="xs"></i>카카오 계정 연동됨</span></div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><label for="nick" style="font-size:14px;font-weight:700">닉네임</label><div style="display:flex;gap:8px"><input class="inp" id="nick" maxlength="12" value="류코딩"><button class="btn" id="nickBtn" disabled="">저장</button></div><span class="help">모임 피드와 공유 카드에 이 이름이 보여요</span></div>
  <div class="card menu" style="padding:4px 0">
   <button><span class="mi-i"><i data-icon="bell" class="s"></i></span><span class="grow">미인증 알림<small>매일 21:00에 알려드려요</small></span><i data-icon="chevR" class="s chev"></i></button><hr>
   <button><span class="mi-i" style="background:var(--s100);color:var(--ink3)"><i data-icon="doc" class="s"></i></span><span class="grow"><span class="todo">이용약관</span></span><i data-icon="chevR" class="s chev"></i></button><hr>
   <button><span class="mi-i" style="background:var(--s100);color:var(--ink3)"><i data-icon="lock" class="s"></i></span><span class="grow"><span class="todo">개인정보처리방침</span></span><i data-icon="chevR" class="s chev"></i></button>
  </div>
  <button class="btn line w100" style="color:var(--bad)"><i data-icon="logout" class="s"></i>로그아웃</button>
  <p class="help" style="text-align:center">버전 0.1.0</p>
 </div><nav class="tabs" aria-label="주요 메뉴">
 <button class=""><i data-icon="calCheck"></i>오늘<span class="badge">1</span></button>
 <button class=""><i data-icon="users"></i>모임</button>
 <button class="on"><i data-icon="user"></i>내 정보</button></nav></div>
</body></html>
