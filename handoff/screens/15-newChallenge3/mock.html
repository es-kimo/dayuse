<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>새 챌린지 3 · 누구와</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="back"></i></button><div class="t">새 챌린지 만들기</div><span class="t2" style="padding-right:8px;font-variant-numeric:tabular-nums">3/3</span></header><div style="padding:0 16px 8px;background:var(--page)"><div class="steps3"><i class="on"></i><i class="on"></i><i class="on"></i></div></div><div class="body" style="padding-top:10px;gap:18px"><h2 style="font-size:21px;font-weight:800;letter-spacing:-0.02em">누구와 함께할까요?</h2>
  <div class="field"><label>못 한 날 약정 금액</label><div class="pills"><button class="pill on">1,000원</button><button class="pill ">3,000원</button><button class="pill ">5,000원</button><button class="pill ">10,000원</button></div><span class="help">모든 참여자에게 똑같이 적용돼요</span></div>
  <div class="field"><label>함께할 모임원 <span style="font-weight:400;color:var(--ink3)">· 나 포함 2명</span></label><div class="mem">
   <button class="on fixed" aria-disabled="true"><i data-dayu="blue" data-face="default" data-size="36px"></i><span class="grow"><b style="font-size:14.5px">류코딩</b> <span class="t2">나 · 필수</span></span><span class="box"><i data-icon="check"></i></span></button>
   <button class="on" aria-pressed="true"><i data-dayu="mint" data-face="default" data-size="36px"></i><b class="grow" style="font-size:14.5px">김운동</b><span class="box"><i data-icon="check"></i></span></button><button class="" aria-pressed="false"><i data-dayu="orange" data-face="default" data-size="36px"></i><b class="grow" style="font-size:14.5px">박기상</b><span class="box"><i data-icon="check"></i></span></button><button class="" aria-pressed="false"><i data-dayu="purple" data-face="default" data-size="36px"></i><b class="grow" style="font-size:14.5px">최독서</b><span class="box"><i data-icon="check"></i></span></button></div></div>
  <div class="card summary" style="background:var(--s100);border:0"><div><span>챌린지</span><b>주 3회 헬스장 가기</b></div><div><span>기간</span><b>9월 28일 ~ · 14일</b></div><div><span>주기 · 방식</span><b>매일 · 각자하기</b></div><div><span>약정</span><b>하루 1,000원</b></div></div>
  <div class="notice"><i data-icon="alert" class="s"></i><span>오늘 시작하는 챌린지라 만들면 바로 확정돼요. 이후에는 참여자와 인증 기준을 바꿀 수 없어요.</span></div></div>
 <div class="foot"><button class="btn ghost lg" style="flex:0 0 96px">이전</button><button class="btn lg grow" id="chNext">챌린지 만들기</button></div></div>
