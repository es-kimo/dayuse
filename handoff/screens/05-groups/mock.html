<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>내 모임</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><div class="t" style="padding-left:4px;font-size:22px">내 모임</div><button class="btn sm"><i data-icon="Plus" class="s"></i>만들기</button></header>
 <div class="body">
  <div class="segc" role="tablist"><button class="on">전체 2</button><button class="">내가 만든 1</button></div>
  <div class="card tap" role="button" tabindex="0"><div class="row"><div class="gi">알</div><div class="grow"><div class="t1" style="display:flex;align-items:center;gap:6px">알고리즘 &amp; 습관 스터디<span class="chip host"><i data-icon="Crown" class="xs"></i>모임장</span></div><div class="t2">멤버 4명 · 챌린지 2개</div></div><i data-icon="ChevronRight" class="chev"></i></div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><div class="stack"><i data-dayu="blue" data-face="default" data-size="36px"></i><i data-dayu="mint" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><i data-dayu="purple" data-face="default" data-size="36px"></i></div><span class="chip warn">오늘 1개 남음</span></div></div><div class="card tap" role="button" tabindex="0"><div class="row"><div class="gi">오</div><div class="grow"><div class="t1" style="display:flex;align-items:center;gap:6px">오운완 운동 크루</div><div class="t2">멤버 5명 · 챌린지 1개</div></div><i data-icon="ChevronRight" class="chev"></i></div>
    <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><div class="stack"><i data-dayu="mint" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><div class="av" style="background:#94A3B8">+3</div></div><span class="chip gray">참여 중 챌린지 없음</span></div></div>
  <div class="card" style="padding:0">
   <button aria-expanded="false" style="width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left;font-size:14.5px;font-weight:700"><i data-icon="Link" class="s"></i><span class="grow">초대 코드로 들어가기</span><i data-icon="ChevronRight" class="s chev"></i></button>
   
  </div>
 </div><nav class="tabs" aria-label="주요 메뉴">
 <button class=""><i data-icon="CalendarCheck"></i>오늘<span class="badge">1</span></button>
 <button class="on"><i data-icon="Users"></i>모임</button>
 <button class=""><i data-icon="User"></i>내 정보</button></nav></div>
</body></html>
