<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>새 챌린지 만들기</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="ArrowLeft"></i></button><div class="t">새 챌린지 만들기</div><span class="t2" style="padding-right:8px;font-variant-numeric:tabular-nums">1/3</span></header><div style="padding:0 16px 8px;background:var(--page)"><div class="steps3"><i class="on"></i><i class=""></i><i class=""></i></div></div><div class="body" style="padding-top:10px;gap:18px"><h2 style="font-size:21px;font-weight:800;letter-spacing:-0.02em">어떤 챌린지인가요?</h2>
  <div class="field"><label for="chT">챌린지 이름 <em>*</em></label><input class="inp" id="chT" placeholder="예: 주 3회 헬스장 가기" value="" maxlength="40"></div>
  <div class="field"><label for="chD">설명 <span style="font-weight:400;color:var(--ink3)">(선택)</span></label><textarea class="inp" id="chD" placeholder="모임원들에게 목표나 규칙을 소개해 주세요"></textarea></div>
  <div class="field"><label for="chC">인증 기준 <em>*</em></label><textarea class="inp" id="chC" placeholder="어떤 사진이면 인증으로 인정할까요?"></textarea>
   <div class="pills"><button class="pill sug">제출 성공 화면 캡처</button><button class="pill sug">운동 기록 앱 캡처</button><button class="pill sug">시계가 보이는 사진</button></div><span class="help">하루에 한 번 인증할 수 있어요</span></div></div>
 <div class="foot"><button class="btn lg grow" id="chNext" disabled="">다음</button></div></div>
</body></html>
