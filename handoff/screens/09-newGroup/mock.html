<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>새 모임 만들기</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="ArrowLeft"></i></button><div class="t">새 모임 만들기</div></header>
 <div class="body" style="padding-top:12px">
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
   <div class="field"><label for="ng">모임 이름 <em>*</em></label><input class="inp" id="ng" maxlength="50" placeholder="예: 미라클모닝 챌린지" value=""></div>
   <div class="pills"><button class="pill sug">미라클모닝 챌린지</button><button class="pill sug">주말 러닝 크루</button><button class="pill sug">퇴근 후 알고리즘</button></div>
   <div style="display:flex;justify-content:space-between"><span class="help">만든 사람이 자동으로 모임장이 돼요</span><span class="cnt" id="ngCnt">0/50</span></div>
  </div>
 </div>
 <div class="foot"><button class="btn lg w100" id="ngBtn" disabled="">모임 만들기</button></div></div>
</body></html>
