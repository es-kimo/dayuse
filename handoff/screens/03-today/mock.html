<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>오늘의 할 일</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><i data-dayu="blue" data-face="default" data-size="64px" data-bare=""></i><div class="t" style="padding-left:6px">오늘</div><button class="ib" aria-label="알림 설정"><i data-icon="bell"></i></button></header>
 <div class="body">
  <div><p class="sub">9월 28일 월요일</p></div>
  <div class="hero ">
   <i data-dayu="blue" data-face="cheer" data-size="64px" data-bare=""></i>
   <div class="grow"><h2>인증할 챌린지가 1개 남았어요</h2>
    <p>자정 전에 사진 한 장이면 끝나요.</p>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px"><div class="prog grow" style="background:#fff"><i style="width:50%;"></i></div><b style="font-size:12.5px;font-variant-numeric:tabular-nums">1/2</b></div></div>
  </div>
  <div class="sec"><h3 style="color:var(--warn)"><i data-icon="clock" class="s"></i>인증 대기 <span style="color:inherit">1</span></h3></div>
  <div class="card task"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="chip blue">알고리즘 &amp; 습관 스터디</span><span class="t2" style="font-weight:700;color:var(--blue)">6일째 이어가는 중</span></div>
   <div class="t1" style="font-size:17px">매일 1알고리즘 문제 풀기</div><div class="crit"><b>인증 기준</b> 제출 성공 화면 캡처 또는 커밋 내역</div>
   <button class="btn w100"><i data-icon="camera" class="s"></i>사진 찍고 인증하기</button></div>
  <div class="sec"><h3 style="color:var(--ok)"><i data-icon="checkC" class="s"></i>완료 <span style="color:inherit">1</span></h3></div>
  <div class="card task done"><div class="row"><div class="thumb"><div class="pic-clock"><div class="sun"></div><b>06:00</b></div></div><div class="grow"><div class="t2">알고리즘 &amp; 습관 스터디</div><div class="t1">6시 기상 습관</div><div class="t2" style="color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">"오늘도 상쾌하게 6시 기상 완료!"</div></div><span class="chip ok"><i data-icon="check" class="xs"></i>12일 연속</span></div></div>
 </div><nav class="tabs" aria-label="주요 메뉴">
 <button class="on" aria-current="page"><i data-icon="calCheck"></i>오늘<span class="badge">1</span></button>
 <button class=""><i data-icon="users"></i>모임</button>
 <button class=""><i data-icon="user"></i>내 정보</button></nav></div>
</body></html>
