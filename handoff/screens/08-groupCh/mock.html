<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모임 · 챌린지 탭</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="back"></i></button><div class="t">알고리즘 &amp; 습관 스터디</div><button class="ib" aria-label="친구 초대"><i data-icon="userPlus"></i></button></header>
 <nav class="ptabs"><button class="">홈</button><button class="on">챌린지<small>2</small></button><button class="">멤버<small>4</small></button></nav><div class="body" style="padding-top:14px"><div class="segc"><button class="on">전체 2</button><button class="">내 참여 2</button></div>
  <div style="display:flex;align-items:center;gap:8px"><div class="pills grow"><button class="pill on">진행 중 2</button><button class="pill ">예정 0</button><button class="pill ">종료 0</button></div><button class="btn sm"><i data-icon="plus" class="s"></i>만들기</button></div>
  <div class="card tap" role="button" tabindex="0" style="display:flex;flex-direction:column;gap:12px">
   <div style="display:flex;gap:6px;align-items:center"><span class="chip ok">● 진행 중</span><span class="chip gray">각자하기</span><span class="chip blue">참여 중</span><span class="grow"></span><i data-icon="chevR" class="chev s"></i></div>
   <div><div class="t1" style="font-size:17px">매일 1알고리즘 문제 풀기</div><div class="t2" style="margin-top:2px">백준이나 프로그래머스 1문제</div></div>
   <div style="display:flex;flex-direction:column;gap:6px"><div class="prog"><i style="width:93.33333333333333%"></i></div><div style="display:flex;justify-content:space-between" class="t2"><span>9월 1일 ~ 30일</span><span style="font-variant-numeric:tabular-nums"><b style="color:var(--ink)">28일째</b> / 30일</span></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><div class="stack"><i data-dayu="blue" data-face="default" data-size="36px"></i><i data-dayu="mint" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><i data-dayu="purple" data-face="default" data-size="36px"></i></div><span class="t2">4명</span></div><span class="chip warn">오늘 남음</span></div>
  </div><div class="card tap" role="button" tabindex="0" style="display:flex;flex-direction:column;gap:12px">
   <div style="display:flex;gap:6px;align-items:center"><span class="chip ok">● 진행 중</span><span class="chip gray">각자하기</span><span class="chip blue">참여 중</span><span class="grow"></span><i data-icon="chevR" class="chev s"></i></div>
   <div><div class="t1" style="font-size:17px">6시 기상 습관</div><div class="t2" style="margin-top:2px">일어나서 시계 사진</div></div>
   <div style="display:flex;flex-direction:column;gap:6px"><div class="prog"><i style="width:46.666666666666664%"></i></div><div style="display:flex;justify-content:space-between" class="t2"><span>9월 15일 ~ 10월 14일</span><span style="font-variant-numeric:tabular-nums"><b style="color:var(--ink)">14일째</b> / 30일</span></div></div>
   <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><div class="stack"><i data-dayu="blue" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><i data-dayu="purple" data-face="default" data-size="36px"></i></div><span class="t2">3명</span></div><span class="chip ok"><i data-icon="check" class="xs"></i>오늘 완료</span></div>
  </div></div></div>
</body></html>
