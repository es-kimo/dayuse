<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>프로필 데이유</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="back"></i></button><div class="t">프로필 데이유</div></header>
 <div class="body" style="padding-top:8px;gap:16px">
  <div class="center" style="gap:12px;padding:12px 0 4px"><i data-dayu="blue" data-face="cheer" data-size="136px"></i><div><div class="t1" style="font-size:18px">류코딩</div><div class="t2">파랑 데이유</div></div></div>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
   <div class="sec" style="margin:0"><h3>색 고르기</h3><button class="btn ghost sm"><i data-icon="shuffle" class="s"></i>랜덤으로 바꾸기</button></div>
   <div class="swatch" role="radiogroup" aria-label="데이유 색"><button role="radio" aria-checked="true" aria-label="파랑" class="on" style="--c:#2563EB"><i data-dayu="blue" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="하늘" class="" style="--c:#0284C7"><i data-dayu="sky" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="민트" class="" style="--c:#0D9488"><i data-dayu="mint" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="초록" class="" style="--c:#16A34A"><i data-dayu="green" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="노랑" class="" style="--c:#CA8A04"><i data-dayu="yellow" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="주황" class="" style="--c:#EA580C"><i data-dayu="orange" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="코랄" class="" style="--c:#E11D48"><i data-dayu="coral" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="분홍" class="" style="--c:#DB2777"><i data-dayu="pink" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="보라" class="" style="--c:#7C3AED"><i data-dayu="purple" data-face="default" data-size="48px"></i></button><button role="radio" aria-checked="false" aria-label="먹색" class="" style="--c:#475569"><i data-dayu="slate" data-face="default" data-size="48px"></i></button></div>
   <p class="help">가입할 때 랜덤으로 정해진 색이에요. 언제든 바꿀 수 있어요.</p>
  </div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
   <div class="t2" style="font-weight:700">모임에서는 이렇게 보여요</div>
   <div class="row"><i data-dayu="blue" data-face="default" data-size="36px"></i><div class="grow"><div class="t1" style="font-size:14.5px">류코딩 <span class="t2" style="font-weight:600">· 나</span></div><div class="t2">매일 1알고리즘 문제 풀기</div></div><span class="t2">방금</span></div>
   <div class="stack" style="margin-top:2px"><i data-dayu="blue" data-face="default" data-size="36px"></i><i data-dayu="mint" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><i data-dayu="purple" data-face="default" data-size="36px"></i></div>
  </div>
 </div>
 <div class="foot"><button class="btn lg w100" disabled="">지금 쓰는 색이에요</button></div></div>
</body></html>
