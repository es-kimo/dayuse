<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모임 초대장</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><div class="body" style="padding-top:28px;gap:18px">
 <div class="center" style="gap:10px">
  <img src="/icon-192.png" alt="" style="width:64px;height:64px;border-radius:18px">
  <span class="chip blue">모임 초대장</span>
  <h1 class="h1">알고리즘 &amp; 습관 스터디</h1>
  <p class="sub">모임장 <b style="color:var(--ink)">류코딩</b>님이 초대했어요</p>
 </div>
 <div class="card" style="display:flex;align-items:center;gap:12px">
  <div class="stack"><i data-dayu="blue" data-face="default" data-size="36px"></i><i data-dayu="mint" data-face="default" data-size="36px"></i><i data-dayu="orange" data-face="default" data-size="36px"></i><i data-dayu="purple" data-face="default" data-size="36px"></i></div>
  <div class="grow"><div class="t1">4명이 함께하고 있어요</div><div class="t2">류코딩, 김운동, 박기상, 최독서</div></div>
 </div>
 <div class="card" style="display:flex;flex-direction:column;gap:12px">
  <div class="sec" style="margin:0"><h3><i data-icon="trophy" class="s"></i>진행 중인 챌린지</h3><span>2개</span></div>
  <div class="row"><div class="gi" style="width:38px;height:38px;font-size:14px">알</div><div class="grow"><div class="t1" style="font-size:14.5px">매일 1알고리즘 문제 풀기</div><div class="t2">매일 · 4명 참여</div></div></div>
  <div class="row"><div class="gi" style="width:38px;height:38px;font-size:14px;background:#F1F5F9;color:#475569">기</div><div class="grow"><div class="t1" style="font-size:14.5px">6시 기상 습관</div><div class="t2">매일 · 3명 참여</div></div></div>
  <div class="notice soft"><i data-icon="info" class="s"></i><span>들어가서 하고 싶은 챌린지만 골라 참여하면 돼요. 모든 챌린지를 할 필요는 없어요.</span></div>
 </div></div>
 <div class="foot" style="flex-direction:column;border:0;background:transparent">
  <button class="btn lg w100">카카오로 시작하고 참여하기</button>
  <button class="btn line w100" style="height:44px;border:0;background:transparent;color:var(--ink3);font-weight:600">데이유즈 둘러보기</button>
 </div></div>
</body></html>
