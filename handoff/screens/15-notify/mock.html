<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>알림 설정</title><link rel="stylesheet" href="../mock.css"></head>
<body>
<div class="app" id="app"><header class="bar"><button class="ib" aria-label="뒤로"><i data-icon="ArrowLeft"></i></button><div class="t">알림 설정</div></header>
 <div class="body" style="padding-top:6px">
  <p class="sub">오늘 인증을 아직 안 한 챌린지가 있을 때만 알려드려요.</p>
  <div class="card row"><div class="grow"><div class="t1">미인증 챌린지 알림</div><div class="t2">하루 한 번, 남은 인증이 있을 때만</div></div><button class="switch on" role="switch" aria-checked="true" aria-label="미인증 챌린지 알림"></button></div>
  <div style="display:flex;flex-direction:column;gap:14px;">
   <div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="t1" style="display:flex;gap:6px;align-items:center"><i data-icon="Clock" class="s"></i>알림 시간 <span class="t2" style="font-weight:400">한국 시간</span></div>
    <div class="pills"><button class="pill ">20:00</button><button class="pill on">21:00</button><button class="pill ">22:00</button><button class="pill ">23:00</button><button class="pill">직접</button></div></div>
   <div class="lock"><div class="tm">21:00</div><div class="dt">9월 28일 월요일 · 미리보기</div><div class="push"><img src="/icon-192.png" alt=""><div class="grow"><div style="display:flex"><b>데이유즈</b><small>지금</small></div><p>오늘 인증할 챌린지가 1개 남았어요. 자정 전에 사진 한 장이면 끝나요.</p></div></div></div>
   <button class="btn ghost w100"><i data-icon="Send" class="s"></i>테스트 알림 보내기</button>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;padding:4px 4px 0"><div class="t1" style="font-size:14px">알아 두세요</div>
   <p class="help">· 오늘 인증을 모두 마친 날에는 알림이 오지 않아요.</p><p class="help">· 알림에는 친구 이름이나 금액이 나오지 않고, 남은 개수만 보여요.</p><p class="help">· 브라우저 알림 권한이 꺼져 있으면 받을 수 없어요.</p></div>
 </div></div>
</body></html>
