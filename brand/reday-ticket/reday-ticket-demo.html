  :root {
    --bg: #f8fafc;
    --card: #fff;
    --line: #e2e8f0;
    --ink: #1e293b;
    --sub: #64748b;
    --pill: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --card: #111a2e;
      --line: #1e293b;
      --ink: #e2e8f0;
      --sub: #94a3b8;
      --pill: #0f172a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --card: #111a2e;
    --line: #1e293b;
    --ink: #e2e8f0;
    --sub: #94a3b8;
    --pill: #0f172a;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Pretendard, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 16px 64px;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .lead {
    margin: 0 0 24px;
    color: var(--sub);
    font-size: 15px;
  }
  .stage {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    height: 380px;
    display: grid;
    place-items: center;
    perspective: 900px;
    overflow: hidden;
    position: relative;
  }
  .tilt {
    width: 300px;
    height: 300px;
    transition: transform 0.25s ease-out;
    transform-style: preserve-3d;
    position: relative;
  }
  .tk {
    width: 100%;
    height: 100%;
    overflow: visible;
    display: block;
  }
  .tk .f {
    fill: #2563eb;
    transition: fill 0.4s;
  }
  .tk .e {
    fill: #1e3a8a;
    transition: fill 0.4s;
  }
  .tk .sf {
    fill: #60a5fa;
  }
  .tk .se {
    fill: #1d4ed8;
  }
  .tk .stub {
    transform-box: view-box;
    transform-origin: 47px 30px;
    transition:
      transform 0.7s cubic-bezier(0.5, 0, 0.75, 0),
      opacity 0.5s 0.2s;
  }
  .stage.used .tk .f {
    fill: #cbd5e1;
  }
  .stage.used .tk .e {
    fill: #94a3b8;
  }
  .stage.used .tk .stub {
    transform: translate(10px, 46px) rotate(38deg);
    opacity: 0;
  }
  .stage.drop .tilt {
    animation: drop 0.65s cubic-bezier(0.2, 0.9, 0.3, 1.25);
  }
  @keyframes drop {
    0% {
      transform: translateY(-260px) rotate(-30deg) scale(0.6);
      opacity: 0;
    }
    100% {
      transform: none;
      opacity: 1;
    }
  }
  .stage.used .tilt {
    animation: nudge 0.35s ease-out;
  }
  @keyframes nudge {
    30% {
      transform: translateX(-6px) rotate(-2deg);
    }
  }
  .shine {
    position: absolute;
    inset: 18% 6%;
    border-radius: 18px;
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0;
    transition: opacity 0.2s;
    background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.75), transparent 45%);
  }
  .stage:hover .shine {
    opacity: 1;
  }
  .stage.used .shine {
    display: none;
  }
  .hint {
    position: absolute;
    left: 16px;
    top: 14px;
    font-size: 12px;
    font-weight: 600;
    color: #2563eb;
    background: #eff6ff;
    padding: 5px 10px;
    border-radius: 99px;
  }
  .btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 16px 0 36px;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-weight: 700;
    font-size: 14px;
    height: 42px;
    padding: 0 18px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button.pri {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  h2 {
    font-size: 17px;
    margin: 0 0 12px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }
  .card p {
    margin: 12px 0 0;
    color: var(--sub);
    font-size: 13px;
    line-height: 1.55;
  }
  .sizes {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    flex-wrap: wrap;
  }
  figure {
    margin: 0;
    text-align: center;
  }
  figcaption {
    font-size: 11px;
    color: var(--sub);
    margin-top: 4px;
  }
  .hdr {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 99px;
    font-weight: 700;
    font-size: 15px;
    background: var(--pill);
    font-variant-numeric: tabular-nums;
  }
  .hdr.dk {
    background: #0f172a;
    border-color: #0f172a;
    color: #fff;
  }
  .hdr img {
    width: 22px;
    height: 22px;
  }
  .hdr i {
    width: 1px;
    height: 14px;
    background: currentColor;
    opacity: 0.2;
    margin: 0 4px;
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 48px;
    border-radius: 12px;
    background: #2563eb;
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    width: 100%;
    margin-top: 12px;
  }
  .cta svg {
    filter: brightness(0) invert(1);
  }
  .states {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .states div {
    text-align: center;
    font-size: 12px;
    color: var(--sub);
  }
  @media (prefers-reduced-motion: reduce) {
    .tilt,
    .tk .stub,
    .tk .f,
    .tk .e {
      transition: none !important;
      animation: none !important;
    }
  }
</style>

<script>
  const st = document.getElementById("st"),
    tl = document.getElementById("tl"),
    sh = tl.querySelector(".shine");
  const rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  st.addEventListener("pointermove", (e) => {
    if (rm) return;
    const r = st.getBoundingClientRect(),
      x = (e.clientX - r.left) / r.width - 0.5,
      y = (e.clientY - r.top) / r.height - 0.5;
    tl.style.transform = `rotateY(${x * 24}deg) rotateX(${-y * 18}deg)`;
    sh.style.setProperty("--x", (x + 0.5) * 100 + "%");
    sh.style.setProperty("--y", (y + 0.5) * 100 + "%");
  });
  st.addEventListener("pointerleave", () => (tl.style.transform = ""));
  function replay(c) {
    st.classList.remove(c);
    void st.offsetWidth;
    st.classList.add(c);
  }
  document.getElementById("get").onclick = () => {
    st.classList.remove("used");
    replay("drop");
  };
  document.getElementById("use").onclick = () => {
    st.classList.remove("drop");
    st.classList.add("used");
  };
  document.getElementById("rst").onclick = () => st.classList.remove("used", "drop");
</script>
