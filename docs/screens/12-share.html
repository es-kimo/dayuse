.app{--blue:#2563EB;--blue7:#1D4ED8;--blue8:#1E40AF;--b50:#EFF6FF;--b100:#DBEAFE;--b300:#93C5FD;
  --ink:#1E293B;--ink2:#475569;--ink3:#64748B;--ink4:#94A3B8;--line:#E2E8F0;--line2:#CBD5E1;--page:#F8FAFC;--card:#fff;--s100:#F1F5F9;
  --ok:#047857;--okbg:#ECFDF5;--okln:#A7F3D0;--warn:#B45309;--warnbg:#FFFBEB;--warnln:#FDE68A;--bad:#B91C1C;--badbg:#FEF2F2;
  position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page);color:var(--ink);font-size:15px;line-height:1.5;color-scheme:light}
.app *:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px}.ic.xs{width:14px;height:14px}
.bar{flex:none;height:56px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:rgba(248,250,252,.92);border-bottom:1px solid transparent}
.bar.line{border-bottom-color:var(--line)}
.bar .t{flex:1;min-width:0;font-size:17px;font-weight:800;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .logo{height:26px}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--ink2);position:relative}
.ib:hover{background:var(--s100)}
.ib .dot{position:absolute;right:9px;top:9px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:1.5px solid #fff}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.body.flush{padding:0}
.foot{flex:none;padding:12px 16px 16px;background:var(--page);border-top:1px solid var(--line);display:flex;gap:10px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:#fff;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--ink4)}
.tabs button.on{color:var(--ink)}
.tabs button.on .ic{color:var(--blue)}
.tabs .badge{position:absolute;margin:-2px 0 0 18px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--blue);color:#fff;font-size:10px;line-height:16px}

.h1{font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.3}
.sub{font-size:14px;color:var(--ink3)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.sec h3{font-size:15px;font-weight:800;letter-spacing:-0.01em;display:flex;align-items:center;gap:6px}
.sec span{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.app[hidden],.before[hidden]{display:none!important}
.btn{white-space:nowrap;flex:none;height:48px;border-radius:12px;border:0;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 15px/1 var(--font);background:var(--blue);color:#fff}
.btn:hover{background:var(--blue7)}
.btn:active{background:var(--blue8)}
.btn.grow{flex:1}
.btn.w100{flex:none}
.btn.lg{height:54px;font-size:16px;border-radius:14px}
.btn.sm{height:36px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn.ghost{background:var(--s100);color:var(--ink)}
.btn.ghost:hover{background:#E2E8F0}
.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.kakao{background:#FEE500;color:#191600}
.btn.kakao:hover{background:#F5DC00}
.btn:disabled{background:#E2E8F0;color:var(--ink4);cursor:not-allowed}
.w100{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.blue{background:var(--b50);color:var(--blue)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gray{background:var(--s100);color:var(--ink3)}
.chip.host{background:#FEF9C3;color:#854D0E}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 13px/1 var(--font);color:#fff}
.gi{flex:none;width:44px;height:44px;border-radius:14px;background:var(--b50);color:var(--blue);display:grid;place-items:center;font:800 17px/1 var(--font)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t1{font-size:15.5px;font-weight:700;letter-spacing:-0.01em}
.t2{font-size:13px;color:var(--ink3)}
.crit{padding:10px 12px;border-radius:12px;background:var(--s100);font-size:13px;color:var(--ink2);line-height:1.5}
.crit b{color:var(--ink);font-weight:700}
.tap{cursor:pointer;transition:background .15s,border-color .15s}
.tap:hover{border-color:var(--line2)}
.chev{color:var(--ink4)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:14px;font-weight:700}
.field label em{font-style:normal;color:var(--bad)}
.inp{width:100%;height:50px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 14px;font:400 15.5px/1 var(--font);color:var(--ink)}
.inp::placeholder{color:var(--ink4)}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--b100)}
textarea.inp{height:auto;min-height:84px;padding:12px 14px;line-height:1.5;resize:none}
.help{font-size:12.5px;color:var(--ink3)}
.cnt{font-size:12px;color:var(--ink4);font-variant-numeric:tabular-nums;text-align:right}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--ink2)}
.pill.on{border-color:var(--blue);background:var(--b50);color:var(--blue)}
.pill.sug{border-style:dashed}
.segc{display:grid;grid-template-columns:repeat(2,1fr);padding:4px;border-radius:12px;background:var(--s100);gap:4px}
.segc button{height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:700;color:var(--ink3)}
.segc button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.08)}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);z-index:40;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:#0F172A;color:#fff;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .ic{color:#6EE7B7}
.scrim{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:30;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px 20px;display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{height:112px;border-radius:16px;border:1.5px dashed var(--line2);background:var(--page);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700}
.pick button span{font-size:12px;font-weight:400;color:var(--ink3)}
.pick button .ic{width:26px;height:26px;color:var(--blue)}
.pick button:hover{border-color:var(--blue);background:var(--b50)}
.photo{position:relative;border-radius:16px;overflow:hidden}
.photo .re{position:absolute;right:10px;top:10px;height:30px;padding:0 10px;border-radius:9px;border:0;background:rgba(15,23,42,.72);color:#fff;font-size:12px;font-weight:700}
.ph-label{position:absolute;left:10px;bottom:10px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.88);font-size:10.5px;color:var(--ink3)}
/* placeholder pictures (no stock photos in the prototype) */
.pic-code{height:190px;background:#0B1222;padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.pic-code i{display:block;height:8px;border-radius:4px}
.pic-clock{height:190px;background:#1E3A8A;display:grid;place-items:center;position:relative}
.pic-clock b{font:800 58px/1 var(--font);letter-spacing:-0.04em;color:#fff;font-variant-numeric:tabular-nums}
.pic-clock .sun{position:absolute;left:-30px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:#3B6FF0;opacity:.6}
.thumb{flex:none;width:52px;height:52px;border-radius:12px;overflow:hidden}
.thumb .pic-clock,.thumb .pic-code{height:52px;padding:8px;gap:4px}
.thumb .pic-clock b{font-size:14px}
.thumb .pic-code i{height:4px}
.thumb .pic-clock .sun{width:40px;height:40px;left:-10px;bottom:-16px}
/* progress */
.prog{height:8px;border-radius:4px;background:var(--s100);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hero{background:var(--b50);border:1px solid var(--b100);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px}
.hero img{width:64px;height:64px;flex:none}
.hero.done{background:var(--okbg);border-color:var(--okln)}
.hero h2{font-size:18px;font-weight:800;letter-spacing:-0.02em;line-height:1.35}
.hero p{font-size:13px;color:var(--ink2);margin-top:4px}
.task{display:flex;flex-direction:column;gap:12px}
.task.done{border-color:var(--okln);background:#FBFEFC}
.feed{display:flex;flex-direction:column;gap:12px}
.post{padding:0;overflow:hidden}
.post .ph{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.post .memo{padding:12px 14px 4px;font-size:14.5px}
.post .acts{display:flex;align-items:center;gap:4px;padding:6px 8px 8px}
.post .acts button{height:34px;padding:0 10px;border:0;border-radius:10px;background:transparent;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--ink3)}
.post .acts button:hover{background:var(--s100)}
.post .acts button.on{color:var(--blue)}
.post .acts .time{margin-left:auto;font-size:12px;color:var(--ink4);padding-right:6px}
.stack{display:flex}
.stack .av{width:30px;height:30px;font-size:11px;border:2px solid #fff;margin-left:-8px}
.stack .av:first-child{margin-left:0}
.ptabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:rgba(248,250,252,.92)}
.ptabs button{height:44px;border:0;background:transparent;font-size:14px;font-weight:700;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.ptabs button small{font-size:12px;color:var(--ink4);margin-left:2px}
.ptabs button.on small{color:var(--blue)}
.who{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.who .m{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;font-size:11.5px;color:var(--ink2)}
.who .m .av{width:44px;height:44px;font-size:14px;position:relative}
.who .m .av.dim{opacity:.35}
.who .m .ck{position:absolute;right:-2px;bottom:-2px;width:18px;height:18px;border-radius:50%;background:var(--ok);border:2px solid #fff;display:grid;place-items:center}
.who .m .ck .ic{width:10px;height:10px;stroke:#fff;stroke-width:3.5}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money div{padding:10px;border-radius:12px;background:var(--s100)}
.money small{display:block;font-size:11.5px;color:var(--ink3)}
.money b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--warnbg);border:1px solid var(--warnln);font-size:13px;color:#78350F;line-height:1.5}
.notice .ic{color:var(--warn);margin-top:1px}
.notice.soft{background:var(--s100);border-color:var(--line);color:var(--ink2)}
.notice.soft .ic{color:var(--ink3)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{padding:12px;border-radius:14px;background:var(--s100)}
.facts small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink3);margin-bottom:4px}
.facts b{font-size:14px;font-weight:700;line-height:1.4}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .hd{font-size:11px;color:var(--ink4);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink4);background:transparent;border:1px solid var(--line)}
.cal .d.done{background:var(--blue);border-color:var(--blue);color:#fff}
.cal .d.miss{background:var(--badbg);border-color:#FECACA;color:var(--bad)}
.cal .d.wait{background:var(--warnbg);border-color:var(--warnln);color:var(--warn)}
.cal .d.today{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.cal .d.blank{border:0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--line)}
.plist{display:flex;flex-direction:column}
.plist .p{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.plist .p:first-child{border-top:0}
.plist .nm{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.plist .bar2{display:flex;align-items:center;gap:8px;margin-top:6px}
.plist .bar2 .prog{flex:1;height:6px}
.plist .bar2 span{font-size:12px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;width:34px;text-align:right}
.plist .fine{text-align:right;font-size:12px;color:var(--ink3)}
.plist .fine b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.steps3{display:flex;gap:6px}
.steps3 i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps3 i.on{background:var(--blue)}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.opt button b{font-size:14.5px}
.opt button span{font-size:12px;color:var(--ink3);line-height:1.45}
.opt button.on{border-color:var(--blue);background:var(--b50)}
.opt button.on b{color:var(--blue)}
.mem{display:flex;flex-direction:column;gap:6px}
.mem button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;text-align:left}
.mem button.on{border-color:var(--blue);background:var(--b50)}
.mem button .av{width:32px;height:32px;font-size:12px}
.mem .box{margin-left:auto;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center}
.mem button.on .box{background:var(--blue);border-color:var(--blue)}
.mem .box .ic{width:14px;height:14px;stroke:#fff;stroke-width:3;opacity:0}
.mem button.on .box .ic{opacity:1}
.mem button.fixed{cursor:default}
.summary{display:flex;flex-direction:column;gap:8px}
.summary div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.summary div span{color:var(--ink3)}
.summary div b{text-align:right}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700}
.stepper b{min-width:56px;text-align:center;font-size:16px}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--blue)}
.switch.on::after{transform:translateX(22px)}
.menu{padding:4px 0}
.menu button,.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:transparent;text-align:left;font-size:15px;font-weight:600}
.menu button:hover{background:var(--page)}
.menu .mi-i{width:36px;height:36px;border-radius:11px;background:var(--b50);color:var(--blue);display:grid;place-items:center;flex:none}
.menu small{display:block;font-size:12.5px;font-weight:400;color:var(--ink3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:0 16px}
.todo{border-bottom:1px dashed var(--ink4)}
.push{display:flex;gap:10px;padding:12px;border-radius:18px;background:rgba(255,255,255,.9);border:1px solid var(--line);box-shadow:0 6px 20px -8px rgba(15,23,42,.25)}
.push img{width:36px;height:36px;border-radius:9px;flex:none}
.push b{font-size:13px}
.push p{font-size:13px;color:var(--ink2)}
.push small{margin-left:auto;font-size:11px;color:var(--ink4)}
.lock{background:linear-gradient(#1E3A8A,#1E3A8A);border-radius:20px;padding:18px 14px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.lock .tm{text-align:center;color:#fff;font:800 40px/1 var(--font);letter-spacing:-0.03em;font-variant-numeric:tabular-nums}
.lock .dt{text-align:center;color:#BFDBFE;font-size:12px;margin-top:-4px}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.dev{border:1.5px dashed var(--line2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.dev .lbl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink3)}
.sel{appearance:none;width:100%;height:46px;border-radius:12px;border:1px solid var(--line2);background:#fff;padding:0 12px;font:400 14.5px/1 var(--font);color:var(--ink)}
/* public share page (dark) */
.sharepg{background:#020617;color:#fff}
.sharepg .body{padding:18px 20px 20px;gap:18px}
.scard{border-radius:28px;background:#0F172A;border:1px solid #1E293B;padding:24px;display:flex;flex-direction:column;gap:18px}
.scard .face{align-self:center;width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center}
.scard .face img{width:64px;height:64px}
.scard .big{text-align:center}
.scard .big b{font-size:56px;font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums}
.scard .big span{font-size:20px;font-weight:800;color:var(--b300);margin-left:4px}
.scard .big p{margin-top:8px;font-size:14px;color:#CBD5E1}
.scard .ch{display:flex;justify-content:space-between;font-size:13px;color:#94A3B8}
.scard .ch b{color:#fff;font-variant-numeric:tabular-nums}
.scard .prog{background:#1E293B}
.dots7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;color:#64748B}
.dots7 i{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;background:var(--blue);margin-bottom:4px}
.dots7 i .ic{width:14px;height:14px;stroke:#fff;stroke-width:3}
.scard .by{border-top:1px solid #1E293B;padding-top:14px;display:flex;justify-content:space-between;align-items:center}
.scard .by b{font-size:17px}
.scard .by span{font-size:12px;color:#64748B}
/* challenge detail v2 */
.av.xs{width:22px;height:22px;font-size:10px}.av.sm{width:32px;height:32px;font-size:12px}
.cd-kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink3);margin-top:4px}
.cd-kick .live{width:8px;height:8px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px #D1FAE5}
.cd-title{margin-top:10px;font-size:30px;line-height:1.22;font-weight:800;letter-spacing:-0.035em}
.cd-desc{margin-top:10px;font-size:15px;line-height:1.65;color:var(--ink2)}
.cd-by{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink3)}
.cd-stat{margin-top:26px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.cd-stat div{padding:14px 0 16px;display:flex;flex-direction:column;gap:6px}
.cd-stat div+div{padding-left:14px;border-left:1px solid var(--line)}
.cd-stat b{white-space:nowrap;font-size:24px;font-weight:800;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;line-height:1}
.cd-stat span{font-size:12.5px;color:var(--ink3);font-weight:600}
.cd-sec{margin-top:34px}
.cd-sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.cd-sh h2{font-size:18px;font-weight:800;letter-spacing:-0.02em}
.cd-sub{font-size:12.5px;color:var(--ink3)}
.cd-key{display:flex;gap:12px;font-size:12px;color:var(--ink3)}
.cd-key span{display:inline-flex;align-items:center;gap:5px}
.cd-key i{width:9px;height:9px;border-radius:50%}
.k-done{background:var(--blue)}.k-miss{border:1.5px solid #F87171}.k-now{border:2px solid var(--ink)}
.ckal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:8px}
.ck-h{text-align:center;font-size:11.5px;font-weight:600;color:var(--ink4);padding-bottom:4px}
.ck{position:relative;height:40px;display:grid;place-items:center}
.ck span{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink3)}
.ck.fut span{color:var(--ink4);font-weight:500}
.ck.done span{background:var(--blue);color:#fff}
.ck.done.jl::before,.ck.done.jr::after{content:"";position:absolute;top:2px;height:36px;background:var(--b100)}
.ck.done.jl::before{left:0;right:50%}.ck.done.jr::after{left:50%;right:0}
.ck.miss span{border:1.5px dashed #F87171}
.ck.miss span::after{content:"";width:10px;height:1.5px;background:#F87171;border-radius:1px}
.ck.wait span{background:var(--warnbg);color:var(--warn);border:1.5px solid var(--warnln)}
.ck.now span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.cd-note{margin-top:14px;font-size:13.5px;color:var(--ink2);padding:12px 14px;border-radius:12px;background:var(--b50)}
.cd-rules{margin:0}
.cd-rules div{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:14.5px}
.cd-rules div:last-child{border-bottom:1px solid var(--line)}
.cd-rules dt{color:var(--ink3);font-weight:600}
.cd-rules dd{margin:0;color:var(--ink);font-weight:600}
.cd-lock{margin-top:12px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3)}
.cd-rank{list-style:none;margin:0;padding:0}
.cd-rank li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cd-rank li:first-child{border-top:0}
.cd-rank li.me{margin:0 -12px;padding:12px;border-radius:14px;background:var(--b50);border-top-color:transparent}
.cd-rank li.me+li{border-top-color:transparent}
.cd-rank em{font-style:normal;width:14px;font-size:13px;font-weight:800;color:var(--ink4);text-align:center}
.cd-rank .nm{font-size:14.5px;font-weight:700}
.cd-rank .nm small{font-size:11px;color:var(--blue);font-weight:700}
.rk-bar{margin-top:6px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.rk-bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.cd-rank li.me .rk-bar i{background:var(--blue)}
.rk-v{text-align:right}
.rk-v b{display:block;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.rk-v small{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

.ch-hero{border-radius:22px;background:var(--b50);border:1px solid var(--b100);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.ch-top{display:flex;gap:6px;align-items:center}
.ch-dday{margin-left:auto;font:800 13px/1 var(--font);color:var(--blue);background:#fff;border:1px solid var(--b100);padding:6px 9px;border-radius:8px;font-variant-numeric:tabular-nums}
.ch-main{display:flex;align-items:flex-end;gap:8px}
.ch-main h1{font-size:24px;line-height:1.28;font-weight:800;letter-spacing:-0.03em}
.ch-main p{margin-top:6px;font-size:13px;color:var(--ink2)}
.ch-main img{width:76px;height:76px;flex:none;margin:-6px -4px -4px 0}
.ch-track{display:flex;flex-direction:column;gap:7px}
.ch-bar{position:relative;height:8px;border-radius:4px;background:#fff}
.ch-bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.ch-bar b{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.ch-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ch-lab strong{color:var(--ink)}
.ch-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.ch-rules{display:flex;gap:6px;flex-wrap:wrap}
.ch-rules span{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:9px;background:var(--s100);font-size:12.5px;font-weight:600;color:var(--ink2)}
.plist .p.me{margin:0 -10px;padding:12px 10px;border-radius:14px;background:var(--b50);border-top-color:transparent}
.plist .p.me+.p{border-top-color:transparent}
.ckal .ck span{width:34px;height:34px;font-size:13px}
.ckal .ck.done.jl::before,.ckal .ck.done.jr::after{top:3px;height:34px}

.av.dy{padding:0;overflow:hidden}
.av.dy svg{width:74%;height:74%;margin-top:14%;display:block}
.av.dy svg path{fill:currentColor}
.pfp{position:relative;border:0;background:transparent;padding:0;border-radius:50%}
.pfp .pen{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.swatch{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;justify-items:center}
.swatch button{border:0;background:transparent;padding:3px;border-radius:50%;box-shadow:0 0 0 2px transparent;transition:box-shadow .15s}
.swatch button.on{box-shadow:0 0 0 2.5px var(--c)}
.stack .av.dy{border:2px solid #fff}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.prog i,.toast,.switch,.switch::after{transition:none}.body{scroll-behavior:auto}}
.app{position:relative!important;width:390px;min-height:844px}.body{overflow:visible!important;flex:1 0 auto}</style>
</head>
