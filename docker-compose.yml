services:
  mysql:
    image: mysql:8.0
    container_name: dayuse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dayuse
      MYSQL_USER: dayuse
      MYSQL_PASSWORD: dayuse
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
